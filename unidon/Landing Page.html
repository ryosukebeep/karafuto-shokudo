<link rel="stylesheet" href="styles.css" />

<style>
  /* Decoration toggle */
  [data-decor="off"] body::before { display: none; }
  [data-decor="off"] .wave-divider { display: none; }
  [data-decor="off"] .hero-sun { display: none; }
  [data-decor="off"] .hero-tag::before { display: none; }
  [data-decor="off"] .sec-title::after { display: none; }
  [data-decor="off"] .about-anniv .rays { display: none; }
  [data-decor="off"] .foot::before { display: none; }
  [data-decor="off"] .about-anniv {
    -webkit-mask-image: none; mask-image: none;
    border: 1px solid var(--paper-edge);
  }
</style>

<body>

<!-- Reusable SVG filter defs — referenced via filter: url(#id) -->
<svg class="svg-filters" aria-hidden="true">
  <defs>
    <filter id="brushEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="2" seed="3" />
      <feDisplacementMap in="SourceGraphic" scale="8" />
    </filter>
    <filter id="roughedge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="2" />
      <feDisplacementMap in="SourceGraphic" scale="2.5" />
    </filter>
    <filter id="paperEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" />
      <feDisplacementMap in="SourceGraphic" scale="5" />
    </filter>
  </defs>
</svg>

<div id="root"></div>
